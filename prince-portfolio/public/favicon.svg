<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <style>
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.15); opacity: 0.7; }
      }
      .c1 { animation: pulse 1.5s ease-in-out infinite; transform-origin: 6px 16px; }
      .c2 { animation: pulse 1.5s ease-in-out infinite 0.3s; transform-origin: 26px 16px; }
      @keyframes glow {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      .n8 { animation: glow 1.5s ease-in-out infinite 0.15s; }
    </style>
  </defs>
  <rect width="32" height="32" fill="#0A0A0A" rx="4"/>
  <text class="c1" x="2" y="23" font-family="monospace" font-size="11" fill="#B39C4F">&#x265B;</text>
  <text class="n8" x="12" y="23" font-family="monospace" font-size="11" fill="#B39C4F">8</text>
  <text class="c2" x="22" y="23" font-family="monospace" font-size="11" fill="#B39C4F">&#x265B;</text>
</svg>
